[package]
name = "rea-idm-mangaer"
version = "0.1.0"
description = "A secure desktop download manager"
authors = ["REA Idm Mangaer contributors"]
edition = "2021"

[lib]
name = "rea_idm_mangaer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rea-idm-mangaer"
path = "src/main.rs"

[[bin]]
name = "rea-idm-native-host"
path = "src/native_host.rs"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-notification = "2.2.0"
tauri-plugin-opener = "2.2.0"
tauri-plugin-autostart = "2.3.0"
tokio = { version = "1.43.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
url = "2.5"
futures-util = "0.3"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"

